name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Redis 8.6.7
        uses: actions/cache@v4
        with:
          path: /tmp/redis-8.6.7
          key: redis-8.6.7-${{ runner.os }}-v1

      - name: Build Redis 8.6.7
        run: |
          set -euo pipefail
          if [[ ! -x /tmp/redis-8.6.7/src/redis-server ]]; then
            sudo apt-get update
            sudo apt-get install -y build-essential
            curl -fsSL -o /tmp/redis-8.6.7.tar.gz https://github.com/redis/redis/archive/refs/tags/8.6.7.tar.gz
            rm -rf /tmp/redis-8.6.7
            tar -C /tmp -xzf /tmp/redis-8.6.7.tar.gz
            libdir="$(dirname "$(gcc -print-file-name=libstdc++.so)")"
            make -C /tmp/redis-8.6.7 -j"$(nproc)" BUILD_TLS=no LDFLAGS="-L${libdir}"
          fi
          /tmp/redis-8.6.7/src/redis-server --version
          echo "FAS_REDIS_SERVER=/tmp/redis-8.6.7/src/redis-server" >> "$GITHUB_ENV"

      - name: Memory cgroup for chaos
        run: |
          set -euo pipefail
          prepare() {
            local dest="$1"
            sudo mkdir -p "$dest"
            sudo chown -R "$(id -u):$(id -g)" "$dest"
            if [[ -f "$dest/memory.swap.max" ]]; then
              echo 0 | sudo tee "$dest/memory.swap.max" >/dev/null || true
              sudo chown "$(id -u):$(id -g)" "$dest/memory.swap.max" || true
            fi
          }
          self="$(awk -F: '{line=$NF} END{print line}' /proc/self/cgroup)"
          base="/sys/fs/cgroup${self}"
          target="${base}/fasoom2"
          sudo mkdir -p "${base}/init" || true
          if [[ -f "${base}/cgroup.procs" ]]; then
            while read -r pid; do
              echo "$pid" | sudo tee "${base}/init/cgroup.procs" >/dev/null || true
            done < "${base}/cgroup.procs" || true
          fi
          echo '+memory' | sudo tee "${base}/cgroup.subtree_control" >/dev/null || true
          prepare "$target" || true
          if [[ ! -w "$target/memory.max" || ! -w "$target/cgroup.procs" ]]; then
            target="/sys/fs/cgroup/fasoom2"
            sudo mkdir -p /sys/fs/cgroup/init || true
            if [[ -f /sys/fs/cgroup/cgroup.procs ]]; then
              while read -r pid; do
                echo "$pid" | sudo tee /sys/fs/cgroup/init/cgroup.procs >/dev/null || true
              done < /sys/fs/cgroup/cgroup.procs || true
            fi
            echo '+memory' | sudo tee /sys/fs/cgroup/cgroup.subtree_control >/dev/null || true
            prepare "$target"
          fi
          test -w "$target/memory.max"
          test -w "$target/cgroup.procs"
          FAS_TEST_OOM_CGROUP="$target" python3 tests/chaos/oom_probe.py
          echo "FAS_TEST_OOM_CGROUP=$target" >> "$GITHUB_ENV"

      - name: Install
        run: pip install -e ".[dev]"

      - name: ruff
        run: ruff check src tests

      - name: import-linter
        run: lint-imports

      - name: pytest
        run: python -m pytest
