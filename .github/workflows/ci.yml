name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Redis 8.6.7
        uses: actions/cache@v4
        with:
          path: /tmp/redis-8.6.7
          key: redis-8.6.7-${{ runner.os }}-v1

      - name: Build Redis 8.6.7
        run: |
          set -euo pipefail
          if [[ ! -x /tmp/redis-8.6.7/src/redis-server ]]; then
            sudo apt-get update
            sudo apt-get install -y build-essential
            curl -fsSL -o /tmp/redis-8.6.7.tar.gz https://github.com/redis/redis/archive/refs/tags/8.6.7.tar.gz
            rm -rf /tmp/redis-8.6.7
            tar -C /tmp -xzf /tmp/redis-8.6.7.tar.gz
            libdir="$(dirname "$(gcc -print-file-name=libstdc++.so)")"
            make -C /tmp/redis-8.6.7 -j"$(nproc)" BUILD_TLS=no LDFLAGS="-L${libdir}"
          fi
          /tmp/redis-8.6.7/src/redis-server --version
          echo "FAS_REDIS_SERVER=/tmp/redis-8.6.7/src/redis-server" >> "$GITHUB_ENV"

      - name: Memory cgroup for chaos
        run: |
          set -x
          self="$(awk -F: '{line=$NF} END{print line}' /proc/self/cgroup)"
          unit="${self##*/}"
          sudo systemctl set-property --runtime "$unit" OOMPolicy=continue || true
          sudo systemctl set-property --runtime system.slice OOMPolicy=continue || true
          sudo systemctl set-property --runtime -- -.slice OOMPolicy=continue || true
          echo "root controllers=$(cat /sys/fs/cgroup/cgroup.controllers 2>/dev/null || true)"
          echo "root subtree=$(cat /sys/fs/cgroup/cgroup.subtree_control 2>/dev/null || true)"
          if ! grep -qw memory /sys/fs/cgroup/cgroup.subtree_control 2>/dev/null; then
            echo '+memory' | sudo tee /sys/fs/cgroup/cgroup.subtree_control >/dev/null \
              || echo "root memory delegate failed"
          fi
          target=/sys/fs/cgroup/fasoom2
          sudo mkdir -p "$target"
          sudo chown -R "$(id -u):$(id -g)" "$target"
          echo "target=$target"
          ls -l "$target/memory.max" "$target/cgroup.procs" || true
          FAS_TEST_OOM_CGROUP="$target" python3 -u tests/chaos/oom_probe.py
          echo "FAS_TEST_OOM_CGROUP=$target" >> "$GITHUB_ENV"

      - name: Install
        run: pip install -e ".[dev]"

      - name: ruff
        run: ruff check src tests

      - name: import-linter
        run: lint-imports

      - name: pytest
        run: python -m pytest
