name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Redis 8.6.7
        uses: actions/cache@v4
        with:
          path: /tmp/redis-8.6.7
          key: redis-8.6.7-${{ runner.os }}-v1

      - name: Build Redis 8.6.7
        run: |
          set -euo pipefail
          if [[ ! -x /tmp/redis-8.6.7/src/redis-server ]]; then
            sudo apt-get update
            sudo apt-get install -y build-essential
            curl -fsSL -o /tmp/redis-8.6.7.tar.gz https://github.com/redis/redis/archive/refs/tags/8.6.7.tar.gz
            rm -rf /tmp/redis-8.6.7
            tar -C /tmp -xzf /tmp/redis-8.6.7.tar.gz
            libdir="$(dirname "$(gcc -print-file-name=libstdc++.so)")"
            make -C /tmp/redis-8.6.7 -j"$(nproc)" BUILD_TLS=no LDFLAGS="-L${libdir}"
          fi
          /tmp/redis-8.6.7/src/redis-server --version
          echo "FAS_REDIS_SERVER=/tmp/redis-8.6.7/src/redis-server" >> "$GITHUB_ENV"

      - name: Memory cgroup for chaos
        run: |
          set -x
          self="$(awk -F: '{line=$NF} END{print line}' /proc/self/cgroup)"
          base="/sys/fs/cgroup${self}"
          target="${base}/fasoom2"
          echo "base=$base type=$(cat "$base/cgroup.type" 2>/dev/null || true)"
          echo "controllers=$(cat "$base/cgroup.controllers" 2>/dev/null || true)"
          echo "subtree=$(cat "$base/cgroup.subtree_control" 2>/dev/null || true)"
          mkdir -p "$base/init" || sudo mkdir -p "$base/init"
          move() {
            local pid="$1"
            echo "$pid" > "$base/init/cgroup.procs" 2>/dev/null && return 0
            sudo sh -c "echo $pid > '$base/init/cgroup.procs'" 2>/dev/null && return 0
            return 1
          }
          for _ in 1 2 3 4 5 6 7 8; do
            mapfile -t pids < "$base/cgroup.procs" || pids=()
            echo "remaining=${#pids[@]}"
            [[ ${#pids[@]} -eq 0 ]] && break
            for pid in "${pids[@]}"; do
              move "$pid" || echo "move failed $pid"
            done
          done
          echo '+memory' > "$base/cgroup.subtree_control" 2>/dev/null \
            || echo '+memory' | sudo tee "$base/cgroup.subtree_control" >/dev/null \
            || echo "subtree_control failed"
          mkdir -p "$target" || sudo mkdir -p "$target"
          sudo chown -R "$(id -u):$(id -g)" "$target" || true
          if [[ -f "$target/memory.swap.max" ]]; then
            echo 0 > "$target/memory.swap.max" 2>/dev/null || sudo sh -c "echo 0 > '$target/memory.swap.max'" || true
          fi
          echo "target files:"; ls -l "$target" || true
          FAS_TEST_OOM_CGROUP="$target" python3 tests/chaos/oom_probe.py
          echo "FAS_TEST_OOM_CGROUP=$target" >> "$GITHUB_ENV"

      - name: Install
        run: pip install -e ".[dev]"

      - name: ruff
        run: ruff check src tests

      - name: import-linter
        run: lint-imports

      - name: pytest
        run: python -m pytest
