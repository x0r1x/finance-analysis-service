definition:
  en: "Cash and cash equivalents at period end. This release does not calculate the line. Subtracted from total debt in Net Debt/EBITDA when both rows are bound."
  ru: "Денежные средства и их эквиваленты на конец периода. Строка в этом релизе не считается. Вычитаются из совокупного долга в Net Debt/EBITDA, когда привязаны обе строки."
