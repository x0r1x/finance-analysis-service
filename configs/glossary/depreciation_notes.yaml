concept: depreciation_notes
pref:
  en: "Depreciation and amortisation of PPE and intangibles"
  ru: "Амортизация основных средств и НМА"
alt:
  ru:
    - "5640"
    - "ф.5 (740)"
    - "Амортизация на конец года (заполняется только 4 кв.)"
    - "Амортизация за соответствующий последний отчетный год"
definition:
  en: "Depreciation and amortisation of PPE and intangibles under FSBU 6/2020 and FSBU 14/2022. The notes, line 5640 or form 5 line 740, are where it is disclosed. The amount's own basis is value_basis on the binding (period, ytd or annual), not the book period grain. includes_rou says whether the amount also contains right-of-use depreciation. icr.bank does not spread an annual amount across quarters."
  ru: "Амортизация основных средств и НМА по ФСБУ 6/2020 и ФСБУ 14/2022. Пояснения, строка 5640 или ф.5 (740), — это источник раскрытия, не период суммы. Своя база суммы — value_basis на привязке (period, ytd или annual), не зерно периода книги. includes_rou говорит, входит ли в сумму амортизация права пользования. Профиль icr.bank годовое значение на кварталы не раскладывает."
