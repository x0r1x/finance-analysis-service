concept: ebitda_ifrs
pref:
  en: "EBITDA (IFRS)"
  ru: "EBITDA (МСФО)"
definition:
  en: "The company's operating profit plus depreciation from the notes for the same period, including right-of-use depreciation when the notes show it. Inside icr.bank that is the IFRS numerator. Asset sales, revaluations, foreign-exchange differences and income from other entities are not removed by this calculation. IFRS does not define EBITDA, and this is not the operating-profit subtotal from the new presentation standard. The figure is not published as its own line, and the model's own EBITDA line is not used in its place."
  ru: "Операционная прибыль компании плюс амортизация пояснений за тот же период, включая амортизацию права пользования, если пояснения её показывают. В профиле icr.bank это числитель МСФО. Продажу активов, переоценку, курсовые разницы и доход от участия в других организациях этот расчёт сам не вычитает. МСФО сам EBITDA не задаёт, и это не новый стандартный подытог «операционная прибыль до амортизации». Отдельной строкой показатель не публикуется, и строка EBITDA из модели на его место не ставится."
