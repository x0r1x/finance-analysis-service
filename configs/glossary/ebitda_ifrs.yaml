concept: ebitda_ifrs
pref:
  en: "EBITDA (IFRS)"
  ru: "EBITDA (МСФО)"
definition:
  en: "The company's operating profit plus depreciation of PPE and intangibles, plus right-of-use depreciation under IFRS 16, for the same period. The right-of-use part is depreciation_rou, or a notes total marked includes_rou. Without one of those, icr.bank does not compute. Inside icr.bank that is the approved IFRS numerator of this internal profile, not a universal IFRS EBITDA. Asset sales, revaluations, foreign-exchange differences and income from other entities are not removed by this calculation. IFRS does not define EBITDA, and this is not the operating-profit subtotal from the new presentation standard. The figure is not published as its own line, and the model's own EBITDA line is not used in its place."
  ru: "Операционная прибыль компании плюс амортизация основных средств и НМА и плюс амортизация права пользования по IFRS 16 за тот же период. Часть права пользования — depreciation_rou либо итог пояснений с пометкой includes_rou. Нет ни того ни другого — профиль icr.bank число не выпускает. В профиле icr.bank это утверждённый числитель МСФО этого внутреннего профиля, не универсальная EBITDA по МСФО. Продажу активов, переоценку, курсовые разницы и доход от участия в других организациях этот расчёт сам не вычитает. МСФО сам EBITDA не задаёт, и это не новый стандартный подытог «операционная прибыль до амортизации». Отдельной строкой показатель не публикуется, и строка EBITDA из модели на его место не ставится."
