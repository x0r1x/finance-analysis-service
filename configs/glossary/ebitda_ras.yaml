concept: ebitda_ras
pref:
  en: "EBITDA (RAS)"
  ru: "EBITDA (РСБУ)"
definition:
  en: "Profit from sales plus depreciation from the notes for the same period. Inside icr.bank that is the RAS numerator. Other income and other expenses are not added. A finance-lease cost inside cost of sales is not added by itself. The figure is not published as its own line, and the model's own EBITDA line is not used in its place."
  ru: "Прибыль от продаж плюс амортизация пояснений за тот же период. В профиле icr.bank это числитель РСБУ. Прочие доходы и прочие расходы в сумму не входят. Расход по финансовому лизингу внутри себестоимости сам по себе не прибавляется. Отдельной строкой показатель не публикуется, и строка EBITDA из модели на его место не ставится."
