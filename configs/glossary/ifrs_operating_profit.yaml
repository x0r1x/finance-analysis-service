concept: ifrs_operating_profit
pref:
  en: "IFRS operating profit line"
  ru: "Операционная прибыль (убыток)"
definition:
  en: "The line the company called operating profit under IFRS. Not RAS profit from sales and not the model line operating_profit. Inside icr.bank it is added to depreciation from the notes."
  ru: "Строка, которую компания назвала операционной прибылью МСФО. Не прибыль от продаж РСБУ и не строка модели operating_profit. В профиле icr.bank складывается с амортизацией пояснений."
