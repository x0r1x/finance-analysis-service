concept: terminal_value
pref:
  en: "Terminal value of the forecast"
  ru: "Терминальная стоимость прогноза"
alt:
  en: ["Terminal value"]
definition:
  en: "Cited value at the end of the forecast. One primary row on the last filled interval is added once inside NPV and IRR. Gordon growth and cap rate are not applied."
  ru: "Цитируется и входит в NPV и IRR одним слагаемым, если основная строка лежит на последнем заполненном интервале. Модель Гордона и ставка капитализации не применяются."
