concept: wacc
pref:
  en: "Weighted average cost of capital"
  ru: "Средневзвешенная стоимость капитала"
alt:
  en: ["WACC"]
definition:
  en: "Cited as the discount rate of free cash flow to all investors. Not calculated from book capital-structure weights."
  ru: "Цитируется как ставка дисконта свободного денежного потока. Из балансовых весов капитала не считается."
