id: corporate
title:
  ru: "Корпоративная (три формы)"
  en: "Corporate three-statement"
signals:
  - kind: sheets_any
    groups:
      - [ОПиУ, ОФР, P&L, "Income statement", "Отчет о финансовых результатах"]
      - [Баланс, "Balance sheet", "Бухгалтерский баланс"]
      - [ДДС, ОДДС, "Cash flow", "Cash flow statement", "Денежные потоки", "Движение денежных средств", "Отчет о движении денежных средств"]
    weight: 1
required_concepts: [ebitda, interest]
metrics:
  icr: {use: required}
  dscr: {use: optional, variant: corporate_covenant}
  net_debt_ebitda: {use: optional}
  adscr: {use: not_applicable}
  dscr_min: {use: not_applicable}
  dscr_avg: {use: not_applicable}
  llcr: {use: not_applicable}
  plcr: {use: not_applicable}
  escrow_coverage: {use: not_applicable}
  npv: {use: not_applicable}
  irr: {use: not_applicable}
  total_debt: {use: optional}
