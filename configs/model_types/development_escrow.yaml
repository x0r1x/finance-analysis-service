id: development_escrow
title:
  ru: "Девелопмент со счетами эскроу (214-ФЗ)"
  en: "Development with escrow accounts"
signals:
  # Один сигнал: второй вес опустил бы книгу только с остатком ниже порога.
  - kind: concepts_bound_any
    concepts: [escrow_balance, escrowed_funds_rate]
    weight: 1
required_concepts:
  - escrow_balance
  - debt_outstanding
  - escrow_inflow
  - escrow_disclosure
  - escrow_coverage
  - effective_rate
  - cfo_statement
  - cfi_statement
  - financing_inflows
  - senior_principal
  - senior_interest_paid
metrics:
  escrow_coverage: {use: required}
  dscr: {use: required, variant: housing}
  icr: {use: not_applicable}
  icr_ebit: {use: not_applicable}
  adscr: {use: optional, variant: housing}
  dscr_min: {use: optional, variant: housing}
  dscr_avg: {use: optional, variant: housing}
  llcr: {use: optional, variant: cbr590}
  plcr: {use: not_applicable}
  net_debt_ebitda: {use: not_applicable}
  npv: {use: not_applicable}
  irr: {use: not_applicable}
  total_debt: {use: not_applicable}
  fcff: {use: not_applicable}
  ncf: {use: optional}
  escrow_blended_rate: {use: optional}
  debt_incl_off_balance: {use: not_applicable}
  icr_lease: {use: not_applicable}
  total_debt_ebitda: {use: not_applicable}
  debt_off_balance_ebitda: {use: not_applicable}
  fcf_identity: {use: not_applicable}
  ncf_period: {use: optional}
