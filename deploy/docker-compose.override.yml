# Local Redis and MinIO. Production does not use this file.
services:
  redis:
    image: redis:8.6.7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    user: "0:0"
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_REGION: ap-northeast-1
      MINIO_SITE_REGION: ap-northeast-1
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  minio-init:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    user: "0:0"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "apk add --no-cache minio-client && mcli alias set local http://minio:9000 minioadmin minioadmin && mcli mb --ignore-existing --region ap-northeast-1 local/finance-context"
    restart: "no"

  finance-analysis:
    environment:
      FAS_REDIS_URL: redis://redis:6379/1
      FAS_S3_BUCKET: finance-context
      FAS_S3_PREFIX: fas
      FAS_S3_ENDPOINT: http://minio:9000
      FAS_S3_REGION: ap-northeast-1
      FAS_S3_ACCESS_KEY: minioadmin
      FAS_S3_SECRET_KEY: minioadmin
      FAS_S3_SSL: "false"
      BUILDER_BASE_URL: http://finance-context:8080
    depends_on:
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  finance-context:
    image: deploy-finance-context:latest
    restart: unless-stopped
    pull_policy: never
    ports:
      - "127.0.0.1:${BUILDER_HOST_PORT:-8080}:8080"
    environment:
      DATA_DIR: /app/data
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: finance-context
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_REGION: ap-northeast-1
    mem_limit: 4g
    volumes:
      - finance-context-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

volumes:
  redis-data:
  minio-data:
  finance-context-data:
