name: finance

services:
  finance-analysis:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FAS_HOST_PORT:-8088}:8080"
    env_file:
      - path: ../.env
        required: false
    environment:
      FAS_DATA_DIR: /data
      FAS_HOST: 0.0.0.0
      FAS_PORT: "8080"
      FAS_EMBEDDED_WORKERS: "true"
      BUILDER_BASE_URL: ""
    volumes:
      - fas-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  fas-data:
