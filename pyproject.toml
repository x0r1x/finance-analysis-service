[project]
name = "finance-analysis-service"
version = "0.22.0"
description = "finance-analysis-service (FAS): семантический и аналитический слой поверх finance-context-builder"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pyarrow>=18",
  "opendal>=0.45,<0.48",
  "redis>=5.2",
  "anyio>=4.6",
  "python-ulid>=2.7",
  "prometheus-client>=0.21",
  "duckdb==1.5.5",
  "duckdb-extension-httpfs==1.5.5",
  "wrenai==0.16.0",
  "orjson>=3.10",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "moto[server]>=5.0",
  "boto3>=1.35",
  "import-linter>=2.1",
]

[project.scripts]
fas-api = "finance_analysis.main:main"
fas = "finance_analysis.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
finance_analysis = ["adapters/storage/schemas/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "s3: needs an S3 API (moto or MinIO)",
  "minio: needs the MinIO server binary",
]

[tool.importlinter]
root_packages = ["finance_analysis"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Hexagonal layers"
type = "layers"
layers = [
  "finance_analysis.adapters",
  "finance_analysis.application",
  "finance_analysis.domain",
]

[[tool.importlinter.contracts]]
name = "Plugins stay on domain and ports"
type = "forbidden"
source_modules = ["finance_analysis.plugins"]
forbidden_modules = [
  "finance_analysis.adapters",
  "finance_analysis.application",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "No synchronous HTTP library in the service"
type = "forbidden"
source_modules = ["finance_analysis"]
forbidden_modules = ["requests"]
allow_indirect_imports = true
