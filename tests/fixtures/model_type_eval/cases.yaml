# Прогон типа модели. Пороги — те же, что FAS_MODEL_TYPE_ACCEPT и FAS_MODEL_TYPE_GAP.
# Packt и RVI грузятся как книги: имена листов и привязки не подменяются.
# К3 сюда не входит.
accept: 0.6
gap: 0.15
cases:
  - id: packt
    source: book
    alias: packt
    expect:
      kind: type
      primary: project_finance
      labels: [project_finance]
  - id: rvi
    source: book
    alias: rvi
    expect:
      kind: type
      primary: project_finance
      labels: [project_finance]
  - id: toll_road
    source: bound
    bound: [cfads, debt_service, npv, irr, discount_rate]
    sheets: [Assumptions, Cash Flow, Returns]
    expect:
      kind: type
      primary: project_finance
      labels: [project_finance]
  - id: port
    source: bound
    bound: [npv, irr, discount_rate, project_fcf]
    sheets: [Inputs, Base Model, Scenarios]
    expect:
      kind: type
      primary: investment_project
      labels: [investment_project]
  - id: hybrid_ppp
    source: bound
    bound: [grantor_payment, cfads, debt_service]
    sheets: []
    expect:
      kind: type
      primary: ppp_concession
      labels: [ppp_concession, project_finance]
  - id: corporate
    source: bound
    bound: []
    sheets: [ОПиУ, Баланс, ДДС]
    expect:
      kind: type
      primary: corporate
      labels: [corporate]
  - id: ambiguous_statements_and_debt
    source: bound
    bound: [cfads, debt_service]
    sheets: [ОПиУ, Баланс, ДДС]
    expect:
      kind: question
      reason: ambiguous
  - id: ask_instead_of_other
    source: bound
    bound: []
    sheets: [Notes]
    expect:
      kind: question
      reason: unknown
  - id: partial_npv
    source: bound
    bound: [npv, irr]
    sheets: []
    expect:
      kind: question
      reason: unknown
  - id: halyard
    source: bound
    bound: [sources_and_uses, exit_enterprise_value, moic, irr, lbo_leverage]
    sheets: [Assumptions, Sources & Uses, Returns]
    expect:
      kind: type
      primary: lbo_ma
      labels: [lbo_ma]
  - id: meridian
    source: bound
    bound: [wacc, terminal_value, enterprise_value, equity_value]
    sheets: [Inputs, WACC, DCF]
    expect:
      kind: type
      primary: dcf_valuation
      labels: [dcf_valuation]
  - id: debtlens
    source: bound
    bound: [noi, cap_rate, vacancy]
    sheets: [Summary, Assumptions, Operating Forecast]
    expect:
      kind: type
      primary: real_estate_income
      labels: [real_estate_income]
  - id: solar_dogu
    source: bound
    bound: [installed_capacity, energy_generation, degradation, energy_tariff]
    sheets: [Model]
    expect:
      kind: type
      primary: renewables_dpm
      labels: [renewables_dpm]
  - id: lease_portfolio
    source: bound
    bound: [lease_interest_income, npl_share, provision_coverage]
    sheets: [Schedule, Summary]
    expect:
      kind: type
      primary: bank_leasing
      labels: [bank_leasing]
  - id: purchase_price_allocation
    source: bound
    bound: [purchase_price_allocation]
    sheets: [Deal]
    expect:
      kind: question
      reason: unknown
  - id: sources_without_exit
    source: bound
    bound: [sources_and_uses, moic]
    sheets: [Sources & Uses]
    expect:
      kind: question
      reason: unknown
